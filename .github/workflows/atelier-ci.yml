# Checks the Atelier web app (atelier/) on every pull request and push that touches it:
# types, lint, unit tests, the row-level-security tests against a real Postgres, a production
# build, then end-to-end tests (Playwright, Chromium) on a desktop and a phone screen. The e2e
# app runs in local-only mode; a second copy with placeholder sign-in settings serves the login
# checks. Nothing here needs a secret.
name: Atelier CI

on:
  pull_request:
    paths:
      - "atelier/**"
      - ".github/workflows/atelier-ci.yml"
  push:
    branches: [main]
    paths:
      - "atelier/**"
      - ".github/workflows/atelier-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atelier-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Playwright supports Ubuntu up to 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: atelier
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atelier
          POSTGRES_PASSWORD: atelier
          POSTGRES_DB: atelier_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atelier -d atelier_test" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      CI: "1"
      DATABASE_URL: postgresql://atelier:atelier@localhost:5432/atelier_test
      NEXT_TELEMETRY_DISABLED: "1"
      # Public, build-time value (not a secret): where the browser would load images from.
      NEXT_PUBLIC_R2_PUBLIC_HOST: assets.example.test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atelier/package-lock.json

      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Row-level security tests
        # Applies every migration (twice) to the Postgres service above, then runs supabase/tests/rls.sql.
        run: bash scripts/test-rls.sh

      - name: Build
        run: npm run build

      - name: Install browser
        # Playwright's own Chromium (the sandbox shortcut in playwright.config.ts only applies when PW_CHROMIUM_PATH
        # is set or /opt/pw-browsers/chromium exists, neither of which is true on a hosted runner).
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (desktop and phone)
        # Reuses the build above: with CI set the config only starts it (`npm start`, local-only) plus a sign-in server.
        run: npm run e2e

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            atelier/playwright-report
            atelier/test-results
          retention-days: 7

  bench:
    # The 1,000-image performance gate (SPEC section 8). Not required: hosted runners have no GPU, so the thresholds are
    # relaxed (--ci multiplies them by BENCH_CI_FACTOR); the official numbers are the local run recorded in docs/PERF.md.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: atelier
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_R2_PUBLIC_HOST: assets.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atelier/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the app with the bench page
        run: |
          ATELIER_LOCAL_ONLY=1 ATELIER_BENCH=1 PORT=3300 npm start &
          for i in $(seq 60); do curl -sf http://localhost:3300/api/health && break; sleep 2; done
      - name: Benchmark
        run: BENCH_URL=http://localhost:3300 npm run bench -- --ci
      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: atelier/bench/results
          retention-days: 14
