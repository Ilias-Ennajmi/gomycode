    <style>
      :root {
        color-scheme: dark light;

          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      p {
        margin: 0;
        max-width: 20rem;
        font-size: 14px;
        line-height: 1.5;
        color: var(--muted);
      }
      a {
        border-radius: 999px;
        background: #7c3aed;
        color: #fff;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
