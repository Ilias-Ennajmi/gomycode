<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>Planet Sport Giveaway</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪐</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<canvas id="stage"></canvas>

<section id="home-screen" class="overlay">
  <div class="panel" style="position: relative;">
    <button id="mute-btn" class="mute-btn" type="button" aria-label="Toggle sound">🔊</button>

    <div class="logo-mark">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="58" rx="47" ry="15" transform="rotate(-18 50 58)" fill="none" stroke="#0a0a0a" stroke-width="8"/>
        <circle cx="44" cy="42" r="27" fill="#0a0a0a"/>
        <path d="M44 15 A27 27 0 0 0 44 69 Z" fill="#ffffff"/>
      </svg>
      <div class="logo-text"><span class="light">PLANET</span><span class="bold">SPORT</span></div>
    </div>

    <h1 class="home-heading title-font">GIVEAWAY</h1>
    <p class="home-tagline">Pick your winners live, on camera, in seconds.</p>

    <div class="date-field">
      <label for="giveaway-date">Giveaway date</label>
      <input type="date" id="giveaway-date" />
    </div>

    <button id="home-start-btn" class="btn btn-primary">Start New Giveaway</button>
  </div>
</section>

<section id="setup-screen" class="overlay" hidden>
  <div class="panel">
    <h1 class="title-font">Who's Playing?</h1>
    <p class="subtitle">Paste your entrants, pick how many winners, and go.</p>

    <label for="names-input">Account names <span class="hint">(one per line, or comma-separated)</span></label>
    <textarea id="names-input" placeholder="@alice&#10;@bob&#10;@carol&#10;..."></textarea>
    <div id="names-count" class="names-count">0 unique names</div>

    <div class="row">
      <div class="field">
        <label for="winners-count">Number of winners</label>
        <input type="number" id="winners-count" min="1" value="1" />
      </div>
      <div class="field checkbox-field">
        <label class="checkbox-label">
          <input type="checkbox" id="allow-duplicates" />
          Allow the same name to win more than once
        </label>
      </div>
    </div>

    <div id="setup-error" class="error" hidden></div>

    <button id="start-btn" class="btn btn-primary">Start Giveaway</button>
    <button id="back-to-home-btn" class="back-link" type="button">← Back</button>
  </div>
</section>

<div id="controls-overlay" class="controls-overlay" hidden>
  <div class="controls-row">
    <button id="download-video-btn" class="btn btn-primary">⬇ Download Video</button>
    <button id="download-image-btn" class="btn btn-secondary">🖼 Download Final Screen</button>
    <button id="restart-btn" class="btn btn-secondary">↺ New Giveaway</button>
  </div>
  <div id="recording-note" class="recording-note" hidden></div>
</div>

<script src="app.js"></script>
</body>
</html>
