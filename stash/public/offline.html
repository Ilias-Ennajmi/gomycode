<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · Stash</title>
  <!-- Standalone page (no app CSS available offline): colours mirror styles/tokens.css. -->
  <style>
    :root { color-scheme: light dark; --bg: #f6f4ef; --fg: #141413; --muted: #5e5b55; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e0e10; --fg: #f2f0eb; --muted: #b4b1aa; } }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 500 15px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); }
    button { min-height: 48px; padding: 0 24px; border-radius: 14px; border: 0; background: #c8f05a; color: #0e0e10;
             font: 600 14px system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Saved items and videos you've watched are still here once the app has loaded them.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
