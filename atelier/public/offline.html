<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · Atelier</title>
  <!-- Standalone page: no app CSS is available offline, so the token colours are repeated here
       (paper, ink and muted from styles/tokens.css; a unit test keeps them in step). -->
  <style>
    :root { color-scheme: light dark; --bg: #f5f2ec; --fg: #141414; --muted: #5e5b55; --accent: #2f4a6d; --on-accent: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #f2f0eb; --muted: #a5a29b; --accent: #8fa8cc; --on-accent: #121212; }
    }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; box-sizing: border-box; padding: 24px;
           background: var(--bg); color: var(--fg); text-align: center;
           font: 400 15px/1.5 "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 26rem; }
    h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); }
    button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent);
             font: 500 15px/1 "Inter Variable", ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
    button:active { transform: scale(0.97); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Atelier couldn't load this page and has no saved copy of it on this device yet. Connect once and it will open offline from then on. Boards you've opened here stay saved on this device.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
